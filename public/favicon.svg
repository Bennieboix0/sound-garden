<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Sound Garden">
  <!--
    The single source for every app icon. Edit this, then run:
        npm run icons

    Deliberately plain: a staff with one notehead. This is a placeholder mark,
    and it has to survive being drawn at 48px on a home screen and then masked
    into a circle by Android, so detail would only turn to mush. All artwork
    sits inside the middle 80% so the maskable variant never clips it.
  -->
  <rect width="512" height="512" fill="#0b0d0c"/>

  <!-- Five staff lines, spanning 22%-78% of the width. -->
  <g fill="#3fa34d">
    <rect x="113" y="204" width="286" height="9" rx="4.5"/>
    <rect x="113" y="238" width="286" height="9" rx="4.5"/>
    <rect x="113" y="272" width="286" height="9" rx="4.5"/>
    <rect x="113" y="306" width="286" height="9" rx="4.5"/>
    <rect x="113" y="340" width="286" height="9" rx="4.5"/>
  </g>

  <!-- Stem, then notehead on the middle line. Drawn second so it sits on top. -->
  <rect x="243" y="153" width="13" height="124" rx="6.5" fill="#6bd97a"/>
  <ellipse cx="222" cy="277" rx="42" ry="29" transform="rotate(-20 222 277)" fill="#6bd97a"/>
</svg>
